<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AI Notes</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg: #111111;
    --bg2: #1C1C1E;
    --bg3: #2C2C2E;
    --card: #242424;
    --border: #2C2C2E;
    --text: #FFFFFF;
    --text2: #8E8E93;
    --text3: #636366;
    --red: #FF3B30;
  }

  html, body {
    height: 100%;
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: -apple-system, "SF Pro Display", "Helvetica Neue", sans-serif;
  }

  .phone {
    width: 390px;
    height: 844px;
    background: #0d0d0d;
    border-radius: 50px;
    overflow: hidden;
    position: relative;
    box-shadow: 0 0 0 10px #1a1a1a, 0 40px 100px rgba(0,0,0,0.9);
  }

  /* ── BOX: Recording screen, fixed, always behind ── */
  #recording {
    position: absolute;
    inset: 0;
    background: #0d0d0d;
    z-index: 1;
    display: flex;
    flex-direction: column;
  }

  /* Recording main content — fades out as lid comes down */
  #rec-content {
    position: absolute;
    top: 0; left: 0; right: 0;
    bottom: 72px; /* leave room for mini-bar */
    display: flex;
    flex-direction: column;
    will-change: opacity;
  }

  /* Mini-bar — at bottom of recording, fades IN at ~80% lid travel */
  #mini-bar {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 72px;
    background: #161616;
    border-top: 0.5px solid #2a2a2a;
    display: flex;
    align-items: center;
    padding: 0 20px;
    gap: 14px;
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    will-change: opacity;
  }
  .mini-handle {
    position: absolute;
    top: 10px; left: 50%;
    transform: translateX(-50%);
    width: 36px; height: 4px;
    background: #3a3a3a;
    border-radius: 2px;
  }
  .mini-wave { display: flex; align-items: center; gap: 3px; }
  .mini-wave span {
    display: block; width: 3px; background: var(--text2); border-radius: 2px;
    animation: minibar-pulse 1.1s ease-in-out infinite;
  }
  .mini-wave span:nth-child(1) { height: 8px;  animation-delay: 0.00s; }
  .mini-wave span:nth-child(2) { height: 16px; animation-delay: 0.12s; }
  .mini-wave span:nth-child(3) { height: 10px; animation-delay: 0.24s; }
  .mini-wave span:nth-child(4) { height: 20px; animation-delay: 0.18s; }
  .mini-wave span:nth-child(5) { height: 12px; animation-delay: 0.06s; }
  .mini-wave span:nth-child(6) { height: 8px;  animation-delay: 0.30s; }
  @keyframes minibar-pulse {
    0%, 100% { transform: scaleY(1);   opacity: 0.5; }
    50%       { transform: scaleY(1.6); opacity: 1;   }
  }
  .mini-timer { font-size: 15px; font-weight: 500; color: var(--text); font-variant-numeric: tabular-nums; flex: 1; }
  .mini-stop {
    width: 36px; height: 36px; border-radius: 50%;
    background: var(--text); border: none; color: #000;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; flex-shrink: 0;
  }

  /* Recording content pieces */
  .swipe-hint {
    text-align: center; font-size: 13px; color: var(--text2);
    padding: 12px 14px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .swipe-hint svg { width: 13px; height: 13px; opacity: 0.6; }

  .rec-header { padding: 8px 20px 0; flex-shrink: 0; }
  .rec-title-row { display: flex; align-items: flex-start; justify-content: space-between; }
  .rec-title { font-size: 32px; font-weight: 700; color: var(--text); line-height: 1.1; }
  .rec-timestamp { font-size: 14px; color: var(--text2); margin-top: 6px; }
  .rec-more {
    background: var(--bg3); border: none; color: var(--text);
    width: 32px; height: 32px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 18px; margin-top: 4px; flex-shrink: 0;
  }
  .paused-badge {
    display: none; background: var(--bg3); border-radius: 9999px;
    padding: 4px 12px; font-size: 12px; font-weight: 500;
    color: var(--text2); align-items: center; gap: 6px;
    position: absolute; top: 8px; right: 20px;
  }
  .paused-badge.visible { display: flex; }
  .paused-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--red); }

  .waveform {
    flex: 1; display: flex; align-items: center; justify-content: center;
    gap: 4px; padding: 0 20px; overflow: hidden;
  }
  .waveform .wbar {
    width: 3px; height: 40px; border-radius: 4px;
    background: var(--text); flex-shrink: 0;
    transform-origin: center center;
  }

  .rec-footer { padding: 0 20px 48px; flex-shrink: 0; }
  .rec-progress-row { display: flex; justify-content: center; margin-bottom: 32px; }
  .rec-timer { font-size: 16px; color: var(--text2); font-variant-numeric: tabular-nums; letter-spacing: 0.5px; }
  .rec-controls { display: flex; align-items: center; justify-content: center; gap: 24px; }
  .ctrl-btn {
    width: 52px; height: 52px; border-radius: 50%;
    background: var(--bg3); border: none; color: var(--text);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: transform 0.1s;
  }
  .ctrl-btn:active { transform: scale(0.94); }
  .ctrl-btn svg { width: 22px; height: 22px; }
  .end-btn {
    background: var(--text); color: #000; border: none;
    border-radius: 9999px; padding: 16px 44px;
    font-size: 17px; font-weight: 600; cursor: pointer;
    transition: transform 0.1s; letter-spacing: -0.2px;
  }
  .end-btn:active { transform: scale(0.97); }

  /* ── LID: Home screen, slides in from above ── */
  #home {
    position: absolute;
    top: 0; left: 0; right: 0;
    /* Does NOT cover the bottom 72px — that's the mini-bar zone */
    height: calc(100% - 72px);
    background: var(--bg);
    z-index: 20;
    display: flex;
    flex-direction: column;
    will-change: transform;
    /* Curved bottom = lid edge */
    border-radius: 0 0 28px 28px;
  }

  .status-bar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 28px 6px; flex-shrink: 0;
  }
  .status-bar .time { font-size: 15px; font-weight: 600; color: var(--text); }
  .status-bar .icons { display: flex; gap: 7px; align-items: center; }

  .home-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 4px 20px 12px; flex-shrink: 0;
  }
  .menu-btn {
    width: 36px; height: 36px; background: none; border: none;
    color: var(--text); display: flex; align-items: center; justify-content: center;
    border-radius: 50%; cursor: pointer;
  }
  .home-header h1 { font-size: 17px; font-weight: 600; color: var(--text); }
  .home-header .placeholder { width: 36px; }

  .notes-scroll { flex: 1; overflow-y: auto; scrollbar-width: none; padding-bottom: 100px; }
  .section-label {
    font-size: 13px; font-weight: 500; color: var(--text2);
    padding: 8px 20px 6px; letter-spacing: 0.2px;
  }
  .note-item {
    display: flex; align-items: center; gap: 14px;
    padding: 12px 20px; cursor: pointer; transition: background 0.15s;
    border-bottom: 0.5px solid var(--border);
  }
  .note-item:active { background: var(--bg3); }
  .note-icon {
    width: 36px; height: 36px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; flex-shrink: 0;
  }
  .note-info { flex: 1; min-width: 0; }
  .note-title {
    font-size: 15px; font-weight: 500; color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 2px;
  }
  .note-meta { font-size: 12px; color: var(--text2); }
  .note-duration { font-size: 12px; color: var(--text3); flex-shrink: 0; }

  .fab {
    position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--text); color: #000; border: none;
    border-radius: 9999px; padding: 14px 32px;
    font-size: 15px; font-weight: 600; cursor: pointer;
    box-shadow: 0 4px 24px rgba(0,0,0,0.4); white-space: nowrap; z-index: 10;
    transition: opacity 0.2s;
  }
  .fab:active { opacity: 0.8; }

  /* ── Processing & Summary (slide up from bottom over everything) ── */
  .screen {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1);
    will-change: transform;
  }
  .screen.hidden { transform: translateY(100%); pointer-events: none; }
  .screen.slide-up { transform: translateY(0); }

  #processing { background: var(--bg); z-index: 30; align-items: center; justify-content: center; gap: 16px; }
  .processing-ring {
    width: 56px; height: 56px; border: 2px solid var(--bg3); border-top-color: var(--text);
    border-radius: 50%; animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .processing-text { font-size: 17px; color: var(--text2); font-weight: 500; }

  #summary { background: var(--bg); z-index: 40; }
  .summary-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 20px 12px; flex-shrink: 0;
  }
  .back-btn {
    background: var(--bg3); border: none; color: var(--text);
    width: 32px; height: 32px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .summary-actions { display: flex; gap: 8px; }
  .icon-btn {
    background: var(--bg3); border: none; color: var(--text);
    width: 32px; height: 32px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .summary-scroll { flex: 1; overflow-y: auto; scrollbar-width: none; padding: 0 20px 40px; }
  .summary-title { font-size: 22px; font-weight: 700; color: var(--text); line-height: 1.3; margin-bottom: 6px; }
  .summary-meta { font-size: 13px; color: var(--text2); margin-bottom: 24px; }
  .summary-section { margin-bottom: 20px; }
  .summary-section-title {
    font-size: 11px; font-weight: 600; color: var(--text2);
    text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 10px;
  }
  .action-item {
    background: var(--card); border-radius: 12px;
    padding: 12px 14px; margin-bottom: 8px;
    display: flex; gap: 10px; align-items: flex-start;
  }
  .action-check {
    width: 20px; height: 20px; border-radius: 50%;
    border: 2px solid var(--border); flex-shrink: 0; margin-top: 1px;
    cursor: pointer; transition: background 0.15s, border-color 0.15s;
  }
  .action-check.done { background: #30D158; border-color: #30D158; }
  .action-text { flex: 1; font-size: 14px; color: var(--text); line-height: 1.4; }
  .action-owner { font-size: 12px; color: var(--text2); margin-top: 2px; }
  .key-point {
    display: flex; gap: 10px; padding: 8px 0;
    border-bottom: 0.5px solid var(--border);
    font-size: 14px; color: var(--text); line-height: 1.5;
  }
  .key-point:last-child { border-bottom: none; }
  .key-point::before { content: "·"; color: var(--text2); flex-shrink: 0; }
  .tag-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .tag { background: var(--bg3); color: var(--text2); border-radius: 9999px; padding: 5px 12px; font-size: 12px; font-weight: 500; }
  .transcript-toggle {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--card); border-radius: 12px; padding: 14px;
    cursor: pointer; color: var(--text2); font-size: 14px;
  }
</style>
</head>
<body>
<div class="phone">

  <!-- BOX: Recording screen, fixed, always rendered -->
  <div id="recording">
    <div id="rec-content">
      <div class="swipe-hint" id="swipe-hint">
        <svg viewBox="0 0 24 24" fill="white"><path d="M12 8l-6 6 1.4 1.4L12 10.8l4.6 4.6L18 14z"/></svg>
        Pull down to return to notes
      </div>
      <div class="rec-header">
        <div class="rec-title-row">
          <div>
            <div class="rec-title" id="rec-title">New note</div>
            <div class="rec-timestamp" id="rec-timestamp"></div>
          </div>
          <button class="rec-more">⋯</button>
        </div>
      </div>
      <div class="paused-badge" id="paused-badge">
        <div class="paused-dot"></div>
        Paused
      </div>
      <div class="waveform" id="waveform"></div>
      <div class="rec-footer">
        <div class="rec-progress-row">
          <span class="rec-timer" id="rec-timer">00:00 / 10:00</span>
        </div>
        <div class="rec-controls">
          <button class="ctrl-btn" id="attach-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round">
              <rect x="3" y="3" width="18" height="18" rx="3"/>
              <circle cx="8.5" cy="8.5" r="1.5" fill="white" stroke="none"/>
              <polyline points="21,15 16,10 5,21"/>
            </svg>
          </button>
          <button class="end-btn" id="end-btn">End</button>
          <button class="ctrl-btn" id="pause-btn">
            <svg viewBox="0 0 24 24" fill="white" id="pause-icon">
              <rect x="6" y="4" width="4" height="16" rx="1"/>
              <rect x="14" y="4" width="4" height="16" rx="1"/>
            </svg>
          </button>
        </div>
      </div>
    </div>

    <!-- Mini-bar: fixed at bottom of recording, fades in when lid is ~80% closed -->
    <div id="mini-bar">
      <div class="mini-handle"></div>
      <div class="mini-wave">
        <span></span><span></span><span></span><span></span><span></span><span></span>
      </div>
      <span class="mini-timer" id="mini-timer">00:00 / 10:00</span>
      <button class="mini-stop" id="mini-end-btn">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="black"><rect x="4" y="4" width="16" height="16" rx="3"/></svg>
      </button>
    </div>
  </div>

  <!-- LID: Home screen, slides down from top like a lid -->
  <div id="home">
    <div class="status-bar">
      <span class="time" id="clock">11:11</span>
      <div class="icons">
        <svg width="16" height="12" viewBox="0 0 16 12" fill="white"><rect x="0" y="3" width="3" height="9" rx="1"/><rect x="4.5" y="1.5" width="3" height="10.5" rx="1"/><rect x="9" y="0" width="3" height="12" rx="1"/><rect x="13.5" y="0" width="2.5" height="12" rx="1" opacity="0.3"/></svg>
        <svg width="16" height="12" viewBox="0 0 16 12" fill="white"><path d="M8 2.4C10.7 2.4 13.1 3.5 14.8 5.4L16 4.2C14 2 11.1.8 8 .8S2 2 0 4.2L1.2 5.4C2.9 3.5 5.3 2.4 8 2.4Z" opacity="0.3"/><path d="M8 5C9.8 5 11.5 5.8 12.7 7.1L13.9 5.9C12.4 4.3 10.3 3.3 8 3.3S3.6 4.3 2.1 5.9L3.3 7.1C4.5 5.8 6.2 5 8 5Z" opacity="0.6"/><circle cx="8" cy="10" r="2"/></svg>
        <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="3.5" stroke="white" stroke-opacity="0.35"/><rect x="2" y="2" width="16" height="8" rx="2" fill="white"/><path d="M23 4V8C24 7.5 24.5 6.8 24.5 6S24 4.5 23 4Z" fill="white" opacity="0.4"/></svg>
      </div>
    </div>
    <div class="home-header">
      <button class="menu-btn">
        <svg width="20" height="14" viewBox="0 0 20 14" fill="white"><rect width="20" height="2" rx="1"/><rect y="6" width="14" height="2" rx="1"/><rect y="12" width="20" height="2" rx="1"/></svg>
      </button>
      <h1>AI notes</h1>
      <div class="placeholder"></div>
    </div>
    <div class="notes-scroll">
      <div class="section-label">Today</div>
      <div id="notes-list"></div>
      <div class="section-label" style="margin-top:8px">Earlier</div>
      <div id="notes-earlier"></div>
    </div>
    <button class="fab" id="fab-btn">+ New note</button>
  </div>

  <!-- Processing & Summary (over everything) -->
  <div class="screen hidden" id="processing">
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px">
      <div class="processing-ring"></div>
      <div class="processing-text">Generating summary…</div>
    </div>
  </div>

  <div class="screen hidden" id="summary">
    <div class="status-bar">
      <span class="time">11:11</span>
      <div class="icons">
        <svg width="16" height="12" viewBox="0 0 16 12" fill="white"><rect x="0" y="3" width="3" height="9" rx="1"/><rect x="4.5" y="1.5" width="3" height="10.5" rx="1"/><rect x="9" y="0" width="3" height="12" rx="1"/></svg>
        <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="3.5" stroke="white" stroke-opacity="0.35"/><rect x="2" y="2" width="16" height="8" rx="2" fill="white"/></svg>
      </div>
    </div>
    <div class="summary-header">
      <button class="back-btn" id="summary-back">
        <svg width="10" height="16" viewBox="0 0 10 16" fill="white"><path d="M8 2L2 8l6 6" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
      </button>
      <div class="summary-actions">
        <button class="icon-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
        </button>
        <button class="icon-btn">
          <svg width="16" height="4" viewBox="0 0 20 4" fill="white"><circle cx="2" cy="2" r="2"/><circle cx="10" cy="2" r="2"/><circle cx="18" cy="2" r="2"/></svg>
        </button>
      </div>
    </div>
    <div class="summary-scroll" id="summary-content"></div>
  </div>

</div>
<script>
// ── CONSTANTS ──
const SCREEN_H  = 844;
const MINI_H    = 72;
// Max travel of lid: fully hidden = lid is above screen
const LID_MAX   = SCREEN_H - MINI_H; // 772px — home slides from -772 → 0
const TENSION   = 65;
const FRICTION  = 11;
const DT        = 0.016;

// ── STATE ──
const state = {
  isRecording: false,
  isPaused: false,
  elapsed: 0,
  maxDuration: 600,
  timerInterval: null,
  notes: [],
};

// ── DOM ──
const $ = id => document.getElementById(id);
const homeEl      = $('home');
const recContent  = $('rec-content');
const miniBar     = $('mini-bar');
const miniTimerEl = $('mini-timer');
const fab         = $('fab-btn');
const recTimer    = $('rec-timer');
const waveformEl  = $('waveform');
const pauseBtn    = $('pause-btn');
const pauseIcon   = $('pause-icon');
const pausedBadge = $('paused-badge');

// ── LID SPRING ENGINE ──
// lidY: -LID_MAX = lid hidden above (recording visible)
//        0       = lid closed (recording faded, mini-bar visible)
let lidY   = 0;      // start with home covering (no recording yet)
let lidVY  = 0;
let target = 0;
let rafId  = null;

function applyLid(y) {
  homeEl.style.transform = `translateY(${y}px)`;

  // progress: 0 = lid fully open (recording visible), 1 = lid fully closed
  const progress = 1 + y / LID_MAX; // y=-772 → 0,  y=0 → 1

  // Recording content: full opacity when lid open, fades to 0 by 80% closed
  recContent.style.opacity = Math.max(0, 1 - progress / 0.8).toFixed(3);

  // Mini-bar: fades in from 80% → 100% of lid travel
  const miniOpacity = state.isRecording
    ? Math.max(0, (progress - 0.8) / 0.2)
    : 0;
  miniBar.style.opacity       = miniOpacity.toFixed(3);
  miniBar.style.pointerEvents = miniOpacity > 0.5 ? 'auto' : 'none';

  // Home interactive only when mostly closed
  homeEl.style.pointerEvents = progress > 0.85 ? 'auto' : 'none';
}

function lidTick() {
  const force = -TENSION * (lidY - target) - FRICTION * lidVY;
  lidVY += force * DT;
  lidY  += lidVY * DT;
  applyLid(lidY);

  if (Math.abs(lidY - target) < 0.5 && Math.abs(lidVY) < 0.5) {
    lidY  = target;
    lidVY = 0;
    applyLid(lidY);
    rafId = null;
    return;
  }
  rafId = requestAnimationFrame(lidTick);
}

function springTo(y) {
  target = y;
  if (!rafId) rafId = requestAnimationFrame(lidTick);
}

// Initial: home covers everything, recording not active
applyLid(0);

// ── DRAG GESTURE on recording screen ──
// Pull DOWN on recording → lid slides in from above
let isDragging     = false;
let dragStartY     = 0;
let dragStartLidY  = 0;

$('recording').addEventListener('touchstart', e => {
  if (e.target.closest('button')) return;
  if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
  isDragging    = true;
  dragStartY    = e.touches[0].clientY;
  dragStartLidY = lidY;
  lidVY = 0;
}, { passive: true });

window.addEventListener('touchmove', e => {
  if (!isDragging) return;
  const dy  = e.touches[0].clientY - dragStartY;
  const newY = Math.max(-LID_MAX, Math.min(0, dragStartLidY + dy));
  lidY = newY;
  applyLid(newY);
}, { passive: true });

window.addEventListener('touchend', e => {
  if (!isDragging) return;
  isDragging = false;
  const dy = e.changedTouches[0].clientY - dragStartY;
  // If dragged down >35% of screen, close lid; else open it
  if (dy > SCREEN_H * 0.35 || (dy > 50 && lidVY > 2)) {
    springTo(0);          // lid closes → recording fades, mini-bar appears
  } else {
    springTo(-LID_MAX);   // lid opens → recording fully visible
  }
});

// Swipe hint tap = pull lid in manually
$('swipe-hint').addEventListener('click', () => springTo(0));

// Mini-bar tap → open lid (spring recording back into view)
miniBar.addEventListener('click', e => {
  if (e.target.closest('#mini-end-btn')) return;
  lidVY = -300; // upward kick
  springTo(-LID_MAX);
  if (!rafId) rafId = requestAnimationFrame(lidTick);
});

$('mini-end-btn').addEventListener('click', () => endRecording(false));

// ── WAVEFORM: 28 bars, staggered right-to-left ──
const BAR_COUNT = 28;
const bars = [];
for (let i = 0; i < BAR_COUNT; i++) {
  const bar = document.createElement('div');
  bar.className = 'wbar';
  waveformEl.appendChild(bar);
  bars.push(bar);
}

// Inject CSS keyframe using custom properties for per-bar min/max
const kfStyle = document.createElement('style');
kfStyle.textContent = `
  @keyframes wbar-pulse {
    from { transform: scaleY(var(--min, 0.2)); }
    to   { transform: scaleY(var(--max, 1.0)); }
  }`;
document.head.appendChild(kfStyle);

function startWaveform() {
  bars.forEach((bar, i) => {
    const mn  = (0.2 + Math.random() * 0.2).toFixed(2);
    const mx  = (0.8 + Math.random() * 0.2).toFixed(2);
    const dur = 500 + Math.round(Math.random() * 200);
    // Right-to-left: bar[27] starts first (delay=0), bar[0] last
    const delay = (BAR_COUNT - 1 - i) * 40;
    bar.style.animation = 'none';
    bar.style.setProperty('--min', mn);
    bar.style.setProperty('--max', mx);
    requestAnimationFrame(() => {
      bar.style.animation = `wbar-pulse ${dur}ms ${delay}ms ease-in-out infinite alternate`;
    });
  });
}
function stopWaveform() {
  bars.forEach(b => { b.style.animation = 'none'; b.style.transform = 'scaleY(0.15)'; });
}

// ── TIMER ──
function formatTime(s) {
  return `${Math.floor(s/60).toString().padStart(2,'0')}:${(s%60).toString().padStart(2,'0')}`;
}
function startTimer() {
  clearInterval(state.timerInterval);
  state.timerInterval = setInterval(() => {
    if (!state.isPaused) {
      state.elapsed++;
      const t = formatTime(state.elapsed);
      recTimer.textContent    = `${t} / 10:00`;
      miniTimerEl.textContent = `${t} / 10:00`;
      if (state.elapsed >= state.maxDuration) endRecording(true);
    }
  }, 1000);
}

// ── CLOCK ──
function updateClock() {
  const n = new Date();
  $('clock').textContent = `${n.getHours().toString().padStart(2,'0')}:${n.getMinutes().toString().padStart(2,'0')}`;
}
setInterval(updateClock, 10000);
updateClock();

// ── NOTES ──
const sampleNotes = [
  { id:1, title:"Product hiring and customer…", time:"09:45 PM", duration:"15:43",   icon:"🟥", summary:"product-hiring" },
  { id:2, title:"New hiring update",            time:"09:45 PM", duration:"01:15:46", icon:"🎨", summary:"hiring-update"  },
  { id:3, title:"Mobile UX review decisi…",     time:"09:45 PM", duration:"02:15:35", icon:"📱", summary:"ux-review"      },
  { id:4, title:"Product hiring and custo…",    time:"09:45 PM", duration:"30:41",   icon:"👕", summary:null             },
  { id:5, title:"New hiring update",            time:"09:45 PM", duration:"30:46",   icon:"🎨", summary:null             },
];
const sampleEarlier = [
  { id:6, title:"Mobile UX review decisi…",  time:"09:45 PM", duration:"50:45", icon:"📱", summary:null },
  { id:7, title:"Product hiringNew hiring…",  time:"09:45 PM", duration:"12:23", icon:"👕", summary:null },
  { id:8, title:"Product hiring and custo…",  time:"09:45 PM", duration:"15:35", icon:"📱", summary:null },
];

function renderNotes() {
  const today = [...state.notes, ...sampleNotes];
  $('notes-list').innerHTML    = '';
  $('notes-earlier').innerHTML = '';
  today.forEach(n => $('notes-list').appendChild(makeNoteEl(n)));
  sampleEarlier.forEach(n => $('notes-earlier').appendChild(makeNoteEl(n)));
}
function makeNoteEl(note) {
  const el = document.createElement('div');
  el.className = 'note-item';
  el.innerHTML = `
    <div class="note-icon">${note.icon||'📝'}</div>
    <div class="note-info">
      <div class="note-title">${note.title}</div>
      <div class="note-meta">${note.time}</div>
    </div>
    <div class="note-duration">${note.duration||'–'}</div>`;
  if (note.summary) el.addEventListener('click', () => showSummary(note.summary));
  return el;
}

// ── SCREEN UTILS ──
function showScreen(el) {
  el.classList.remove('hidden');
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('slide-up')));
}
function hideScreen(el) {
  el.classList.remove('slide-up');
  setTimeout(() => el.classList.add('hidden'), 400);
}

// ── START RECORDING ──
$('fab-btn').addEventListener('click', () => {
  const now = new Date();
  const h = now.getHours(), m = now.getMinutes().toString().padStart(2,'0');
  $('rec-timestamp').textContent = `${((h%12)||12).toString().padStart(2,'0')}:${m} ${h>=12?'PM':'AM'}`;
  $('rec-title').textContent     = 'New note';

  state.isRecording = true;
  state.isPaused    = false;
  state.elapsed     = 0;
  recTimer.textContent    = '00:00 / 10:00';
  miniTimerEl.textContent = '00:00 / 10:00';

  // Spring lid UP: home slides out the top, recording revealed
  lidVY = -400; // kick upward
  springTo(-LID_MAX);
  if (!rafId) rafId = requestAnimationFrame(lidTick);

  startTimer();
  startWaveform();
});

// ── PAUSE ──
pauseBtn.addEventListener('click', () => {
  state.isPaused = !state.isPaused;
  if (state.isPaused) {
    pauseIcon.innerHTML = `<path d="M8 5v14l11-7z" fill="white"/>`;
    pausedBadge.classList.add('visible');
  } else {
    pauseIcon.innerHTML = `<rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/>`;
    pausedBadge.classList.remove('visible');
  }
});

// ── END ──
$('end-btn').addEventListener('click', () => endRecording(false));

function endRecording() {
  clearInterval(state.timerInterval);
  stopWaveform();
  state.isRecording = false;
  state.isPaused    = false;
  pausedBadge.classList.remove('visible');

  // Lid comes back down (home returns) then shows processing
  springTo(0);

  setTimeout(() => {
    showScreen($('processing'));
    setTimeout(() => {
      hideScreen($('processing'));
      state.notes.unshift({
        id: Date.now(), title:'New note',
        time: new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}),
        duration: formatTime(state.elapsed), icon:'🎙️', summary:'ux-review',
      });
      renderNotes();
      state.elapsed = 0;
      recTimer.textContent    = '00:00 / 10:00';
      miniTimerEl.textContent = '00:00 / 10:00';
      setTimeout(() => showSummary('ux-review'), 200);
    }, 1800);
  }, 400);
}

function showSummary(key) {
  const d = summaries[key];
  if (!d) return;
  $('summary-content').innerHTML = `
    <div class="summary-title">${d.title}</div>
    <div class="summary-meta">${d.meta}</div>
    <div class="summary-section">
      <div class="summary-section-title">✅ Action Items</div>
      ${d.actions.map(a=>`
        <div class="action-item">
          <div class="action-check ${a.done?'done':''}"></div>
          <div><div class="action-text">${a.text}</div><div class="action-owner">${a.owner}</div></div>
        </div>`).join('')}
    </div>
    <div class="summary-section">
      <div class="summary-section-title">📌 Key Points</div>
      ${d.points.map(p=>`<div class="key-point">${p}</div>`).join('')}
    </div>
    <div class="summary-section">
      <div class="summary-section-title">Tags</div>
      <div class="tag-row">${d.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
    </div>
    <div class="summary-section">
      <div class="transcript-toggle">
        <span>Transcript</span>
        <svg width="12" height="8" viewBox="0 0 12 8" fill="white" opacity="0.5"><path d="M1 1l5 5 5-5"/></svg>
      </div>
    </div>`;
  $('summary-content').querySelectorAll('.action-check').forEach(el =>
    el.addEventListener('click', () => el.classList.toggle('done'))
  );
  showScreen($('summary'));
}

$('summary-back').addEventListener('click', () => hideScreen($('summary')));
