<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AI Notes</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg: #111111;
    --bg2: #1C1C1E;
    --bg3: #2C2C2E;
    --surface: #1C1C1E;
    --card: #242424;
    --border: #2C2C2E;
    --text: #FFFFFF;
    --text2: #8E8E93;
    --text3: #636366;
    --accent: #FFFFFF;
    --red: #FF3B30;
    --radius: 16px;
  }

  html, body {
    height: 100%;
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: -apple-system, "SF Pro Display", "Helvetica Neue", sans-serif;
  }

  .phone {
    width: 390px;
    height: 844px;
    background: var(--bg);
    border-radius: 50px;
    overflow: hidden;
    position: relative;
    box-shadow: 0 0 0 10px #1a1a1a, 0 40px 100px rgba(0,0,0,0.9);
  }

  .screen {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1), opacity 0.3s ease;
    will-change: transform;
  }
  .screen.hidden { transform: translateY(100%); pointer-events: none; }
  .screen.slide-up { transform: translateY(0); }

  .status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 28px 6px;
    flex-shrink: 0;
  }
  .status-bar .time { font-size: 15px; font-weight: 600; color: var(--text); }
  .status-bar .icons { display: flex; gap: 7px; align-items: center; }

  #home { background: var(--bg); }
  .home-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 4px 20px 12px;
    flex-shrink: 0;
  }
  .home-header .menu-btn {
    width: 36px; height: 36px;
    background: none; border: none;
    color: var(--text);
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%;
    cursor: pointer;
    font-size: 20px;
  }
  .home-header h1 { font-size: 17px; font-weight: 600; color: var(--text); }
  .home-header .placeholder { width: 36px; }

  .notes-scroll {
    flex: 1;
    overflow-y: auto;
    scrollbar-width: none;
    padding-bottom: 100px;
  }

  .section-label {
    font-size: 13px;
    font-weight: 500;
    color: var(--text2);
    padding: 8px 20px 6px;
    letter-spacing: 0.2px;
  }

  .note-item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 20px;
    cursor: pointer;
    transition: background 0.15s;
    border-bottom: 0.5px solid var(--border);
  }
  .note-item:active { background: var(--bg3); }

  .note-icon {
    width: 36px; height: 36px;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
  }

  .note-info { flex: 1; min-width: 0; }
  .note-title {
    font-size: 15px; font-weight: 500; color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    margin-bottom: 2px;
  }
  .note-meta { font-size: 12px; color: var(--text2); }
  .note-duration { font-size: 12px; color: var(--text3); flex-shrink: 0; }

  .fab {
    position: absolute;
    bottom: 80px; left: 50%;
    transform: translateX(-50%);
    background: var(--text); color: #000;
    border: none; border-radius: 9999px;
    padding: 14px 32px;
    font-size: 15px; font-weight: 600;
    cursor: pointer;
    box-shadow: 0 4px 24px rgba(0,0,0,0.4);
    white-space: nowrap;
    transition: transform 0.15s, opacity 0.15s;
    z-index: 10;
  }
  .fab:active { transform: translateX(-50%) scale(0.97); }
  .fab.hidden { opacity: 0; pointer-events: none; }

  #recording-bar {
    position: absolute;
    bottom: 20px; left: 20px; right: 20px;
    background: var(--bg2);
    border-radius: 16px;
    padding: 12px 16px;
    display: flex; align-items: center; gap: 12px;
    cursor: pointer;
    border: 1px solid var(--border);
    transition: opacity 0.3s, transform 0.3s;
    z-index: 10;
  }
  #recording-bar.hidden { opacity: 0; pointer-events: none; transform: translateY(12px); }
  .rec-bar-wave { display: flex; align-items: center; gap: 2px; }
  .rec-bar-wave span {
    display: block; width: 2px; background: var(--text2); border-radius: 2px;
    animation: bar-idle 1.2s ease-in-out infinite;
  }
  .rec-bar-wave span:nth-child(1) { height: 8px; animation-delay: 0s; }
  .rec-bar-wave span:nth-child(2) { height: 14px; animation-delay: 0.1s; }
  .rec-bar-wave span:nth-child(3) { height: 10px; animation-delay: 0.2s; }
  .rec-bar-wave span:nth-child(4) { height: 16px; animation-delay: 0.15s; }
  .rec-bar-wave span:nth-child(5) { height: 8px; animation-delay: 0.05s; }
  @keyframes bar-idle {
    0%, 100% { transform: scaleY(1); opacity: 0.6; }
    50% { transform: scaleY(1.5); opacity: 1; }
  }
  .rec-bar-timer { font-size: 14px; font-weight: 500; color: var(--text); font-variant-numeric: tabular-nums; }
  .rec-bar-label { font-size: 12px; color: var(--text2); flex: 1; }
  .rec-bar-end {
    background: none; border: 1px solid var(--border);
    color: var(--text); border-radius: 9999px;
    padding: 5px 14px; font-size: 13px; font-weight: 500; cursor: pointer;
  }
  .rec-bar-end:active { background: var(--bg3); }

  #recording {
    background: var(--bg);
    transform: translateY(100%);
    z-index: 20;
  }

  .swipe-hint {
    text-align: center; font-size: 13px; color: var(--text2);
    padding: 14px; cursor: pointer; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .swipe-hint svg { width: 14px; height: 14px; opacity: 0.6; }

  .rec-header { padding: 8px 20px 0; flex-shrink: 0; }
  .rec-title-row { display: flex; align-items: flex-start; justify-content: space-between; }
  .rec-title { font-size: 32px; font-weight: 700; color: var(--text); line-height: 1.1; }
  .rec-timestamp { font-size: 14px; color: var(--text2); margin-top: 6px; }
  .rec-more {
    background: var(--bg3); border: none; color: var(--text);
    width: 32px; height: 32px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 18px; margin-top: 4px; flex-shrink: 0;
  }

  .waveform {
    flex: 1;
    display: flex; align-items: center; justify-content: center;
    gap: 3px; padding: 0 20px; overflow: hidden;
  }
  .waveform .bar {
    width: 3px; border-radius: 3px; background: var(--text);
    flex-shrink: 0; transition: height 0.08s ease;
  }
  .waveform .bar.past { background: var(--text3); }
  .waveform .bar.future { background: var(--bg3); height: 4px !important; }

  .rec-footer { padding: 0 20px 48px; flex-shrink: 0; }
  .rec-progress-row { display: flex; justify-content: center; margin-bottom: 32px; }
  .rec-timer {
    font-size: 16px; color: var(--text2);
    font-variant-numeric: tabular-nums; letter-spacing: 0.5px;
  }
  .rec-controls {
    display: flex; align-items: center;
    justify-content: center; gap: 24px;
  }
  .ctrl-btn {
    width: 52px; height: 52px; border-radius: 50%;
    background: var(--bg3); border: none; color: var(--text);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: transform 0.1s, background 0.1s;
  }
  .ctrl-btn:active { transform: scale(0.94); }
  .ctrl-btn svg { width: 22px; height: 22px; }

  .end-btn {
    background: var(--text); color: #000; border: none;
    border-radius: 9999px; padding: 16px 44px;
    font-size: 17px; font-weight: 600; cursor: pointer;
    transition: transform 0.1s, opacity 0.1s; letter-spacing: -0.2px;
  }
  .end-btn:active { transform: scale(0.97); }

  #processing {
    background: var(--bg); z-index: 30;
    align-items: center; justify-content: center; gap: 16px;
    transform: translateY(100%);
  }
  .processing-ring {
    width: 56px; height: 56px;
    border: 2px solid var(--bg3); border-top-color: var(--text);
    border-radius: 50%; animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .processing-text { font-size: 17px; color: var(--text2); font-weight: 500; }

  #summary { background: var(--bg); z-index: 40; transform: translateY(100%); }
  .summary-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 20px 12px; flex-shrink: 0;
  }
  .back-btn {
    background: var(--bg3); border: none; color: var(--text);
    width: 32px; height: 32px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .summary-actions { display: flex; gap: 8px; }
  .icon-btn {
    background: var(--bg3); border: none; color: var(--text);
    width: 32px; height: 32px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .summary-scroll { flex: 1; overflow-y: auto; scrollbar-width: none; padding: 0 20px 40px; }
  .summary-title { font-size: 22px; font-weight: 700; color: var(--text); line-height: 1.3; margin-bottom: 6px; }
  .summary-meta { font-size: 13px; color: var(--text2); margin-bottom: 24px; }
  .summary-section { margin-bottom: 20px; }
  .summary-section-title {
    font-size: 11px; font-weight: 600; color: var(--text2);
    text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 10px;
  }
  .action-item {
    background: var(--card); border-radius: 12px;
    padding: 12px 14px; margin-bottom: 8px;
    display: flex; gap: 10px; align-items: flex-start;
  }
  .action-check {
    width: 20px; height: 20px; border-radius: 50%;
    border: 2px solid var(--border); flex-shrink: 0; margin-top: 1px;
    cursor: pointer; transition: background 0.15s, border-color 0.15s;
  }
  .action-check.done { background: #30D158; border-color: #30D158; }
  .action-text { flex: 1; font-size: 14px; color: var(--text); line-height: 1.4; }
  .action-owner { font-size: 12px; color: var(--text2); margin-top: 2px; }
  .key-point {
    display: flex; gap: 10px; padding: 8px 0;
    border-bottom: 0.5px solid var(--border);
    font-size: 14px; color: var(--text); line-height: 1.5;
  }
  .key-point:last-child { border-bottom: none; }
  .key-point::before { content: "·"; color: var(--text2); flex-shrink: 0; margin-top: 1px; }
  .tag-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .tag {
    background: var(--bg3); color: var(--text2);
    border-radius: 9999px; padding: 5px 12px;
    font-size: 12px; font-weight: 500;
  }
  .transcript-toggle {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--card); border-radius: 12px; padding: 14px;
    cursor: pointer; color: var(--text2); font-size: 14px;
  }
  .paused-badge {
    display: none; background: var(--bg3); border-radius: 9999px;
    padding: 4px 12px; font-size: 12px; font-weight: 500;
    color: var(--text2); align-items: center; gap: 6px;
    position: absolute; top: 70px; right: 20px;
  }
  .paused-badge.visible { display: flex; }
  .paused-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--red); }
</style>
</head>

const waveHeights = [];

function getRandomHeight() { return Math.floor(Math.random() * 80) + 6; }

function updateWaveformBars() {
  const bars = waveform.querySelectorAll('.bar');
  const progress = state.elapsed / state.maxDuration;
  const playhead = Math.floor(progress * BAR_COUNT);
  bars.forEach((bar, i) => {
    if (i < playhead) {
      bar.className = 'bar past';
      if (!waveHeights[i] || waveHeights[i] === 4) waveHeights[i] = getRandomHeight();
      bar.style.height = waveHeights[i] + 'px';
    } else if (i === playhead) {
      bar.className = 'bar';
      waveHeights[i] = getRandomHeight();
      bar.style.height = waveHeights[i] + 'px';
    } else {
      bar.className = 'bar future'; bar.style.height = '4px';
    }
  });
}

let waveAnim = null;
function startWaveAnim() {
  clearInterval(waveAnim);
  waveAnim = setInterval(() => {
    if (!state.isPaused && state.isRecording) {
      const bars = waveform.querySelectorAll('.bar');
      const playhead = Math.floor((state.elapsed / state.maxDuration) * BAR_COUNT);
      for (let j = Math.max(0, playhead - 2); j <= Math.min(BAR_COUNT-1, playhead+2); j++) {
        if (j <= playhead) { waveHeights[j] = getRandomHeight(); bars[j].style.height = waveHeights[j]+'px'; }
      }
    }
  }, 80);
}
function stopWaveAnim() { clearInterval(waveAnim); }

function formatTime(s) {
  return `${Math.floor(s/60).toString().padStart(2,'0')}:${(s%60).toString().padStart(2,'0')}`;
}

function startTimer() {
  clearInterval(state.timerInterval);
  state.timerInterval = setInterval(() => {
    if (!state.isPaused) {
      state.elapsed++;
      const t = formatTime(state.elapsed);
      $('rec-timer').textContent = `${t} / 10:00`;
      $('bar-timer').textContent = t;
      updateWaveformBars();
      if (state.elapsed >= state.maxDuration) endRecording(true);
    }
  }, 1000);
}

function updateClock() {
  const now = new Date();
  $('clock').textContent = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
}
setInterval(updateClock, 10000); updateClock();

function renderNotes() {
  const listEl = $('notes-list'), earlierEl = $('notes-earlier');
  const today = [...state.notes.map(n=>({...n,fresh:true})), ...sampleNotes];
  listEl.innerHTML = ''; today.forEach(n => listEl.appendChild(makeNoteEl(n)));
  earlierEl.innerHTML = ''; sampleEarlier.forEach(n => earlierEl.appendChild(makeNoteEl(n)));
}

function makeNoteEl(note) {
  const el = document.createElement('div');
  el.className = 'note-item';
  el.innerHTML = `
    <div class="note-icon">${note.icon||'📝'}</div>
    <div class="note-info">
      <div class="note-title">${note.title}</div>
      <div class="note-meta">${note.time}</div>
    </div>
    <div class="note-duration">${note.duration||'–'}</div>`;
  if (note.summary) el.addEventListener('click', () => showSummary(note.summary));
  return el;
}

function showScreen(el) {
  el.classList.remove('hidden');
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('slide-up')));
}
function hideScreen(el) {
  el.classList.remove('slide-up');
  setTimeout(() => el.classList.add('hidden'), 400);
}

$('fab-btn').addEventListener('click', () => {
  const now = new Date();
  const h = now.getHours(), m = now.getMinutes().toString().padStart(2,'0');
  const ampm = h>=12?'PM':'AM', h12 = ((h%12)||12).toString().padStart(2,'0');
  $('rec-timestamp').textContent = `${h12}:${m} ${ampm}`;
  $('rec-title').textContent = 'New note';
  state.isRecording = true; state.isPaused = false; state.isHidden = false; state.elapsed = 0;
  $('rec-timer').textContent = '00:00 / 10:00'; $('bar-timer').textContent = '00:00';
  updateWaveformBars();
  showScreen(recScreen); startTimer(); startWaveAnim();
});

function hideToBackground() {
  state.isHidden = true;
  hideScreen(recScreen);
  recBar.classList.remove('hidden');
  fab.classList.add('hidden');
}

$('swipe-hint').addEventListener('click', hideToBackground);

let touchStartY = 0;
recScreen.addEventListener('touchstart', e => { touchStartY = e.touches[0].clientY; }, {passive:true});
recScreen.addEventListener('touchmove', e => {
  const dy = e.touches[0].clientY - touchStartY;
  if (dy > 0) recScreen.style.transform = `translateY(${Math.min(dy,200)}px)`;
}, {passive:true});
recScreen.addEventListener('touchend', e => {
  const dy = e.changedTouches[0].clientY - touchStartY;
  recScreen.style.transform = '';
  if (dy > 80) hideToBackground();
});

$('recording-bar').addEventListener('click', e => {
  if (e.target === $('bar-end-btn')) return;
  state.isHidden = false;
  recBar.classList.add('hidden'); fab.classList.remove('hidden');
  showScreen(recScreen);
});

$('bar-end-btn').addEventListener('click', () => endRecording(false));

pauseBtn.addEventListener('click', () => {
  state.isPaused = !state.isPaused;
  if (state.isPaused) {
    pauseIcon.innerHTML = `<path d="M8 5v14l11-7z" fill="white"/>`;
    pausedBadge.classList.add('visible');
  } else {
    pauseIcon.innerHTML = `<rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/>`;
    pausedBadge.classList.remove('visible');
  }
});

$('end-btn').addEventListener('click', () => endRecording(false));

function endRecording(timeout) {
  clearInterval(state.timerInterval); stopWaveAnim();
  state.isRecording = false; state.isPaused = false;
  pausedBadge.classList.remove('visible');
  recBar.classList.add('hidden'); fab.classList.remove('hidden');
  if (!recScreen.classList.contains('hidden')) hideScreen(recScreen);
  setTimeout(() => {
    showScreen(procScreen);
    setTimeout(() => {
      hideScreen(procScreen);
      const newNote = {
        id: Date.now(), title: 'New note',
        time: new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}),
        duration: formatTime(state.elapsed), icon: '🎙️', summary: 'ux-review',
      };
      state.notes.unshift(newNote); renderNotes(); state.elapsed = 0;
      waveform.querySelectorAll('.bar').forEach(b => { b.className='bar future'; b.style.height='4px'; });
      setTimeout(() => showSummary('ux-review'), 200);
    }, 1800);
  }, 200);
}

function showSummary(key) {
  const data = summaries[key]; if (!data) return;
  const actionsHtml = data.actions.map((a,i) => `
    <div class="action-item">
      <div class="action-check ${a.done?'done':''}" data-i="${i}"></div>
      <div><div class="action-text">${a.text}</div><div class="action-owner">${a.owner}</div></div>
    </div>`).join('');
  const pointsHtml = data.points.map(p=>`<div class="key-point">${p}</div>`).join('');
  const tagsHtml = data.tags.map(t=>`<span class="tag">${t}</span>`).join('');
  $('summary-content').innerHTML = `
    <div class="summary-title">${data.title}</div>
    <div class="summary-meta">${data.meta}</div>
    <div class="summary-section"><div class="summary-section-title">✅ Action Items</div>${actionsHtml}</div>
    <div class="summary-section"><div class="summary-section-title">📌 Key Points</div>${pointsHtml}</div>
    <div class="summary-section"><div class="summary-section-title">Tags</div><div class="tag-row">${tagsHtml}</div></div>
    <div class="summary-section"><div class="transcript-toggle"><span>Transcript</span><svg width="12" height="8" viewBox="0 0 12 8" fill="white" opacity="0.5"><path d="M1 1l5 5 5-5"/></svg></div></div>`;
  $('summary-content').querySelectorAll('.action-check').forEach(el => {
    el.addEventListener('click', () => el.classList.toggle('done'));
  });
  showScreen(summaryScreen);
}

$('summary-back').addEventListener('click', () => hideScreen(summaryScreen));
renderNotes();
</script>
</body>
</html>
